# Tempel blok ini di C:\xampp\apache\conf\extra\httpd-vhosts.conf lalu restart Apache.
# Sebelumnya jalankan sekali:  npm install  &&  npm run build   (hasil build ada di dist/)
<VirtualHost *:80>
    ServerName clorismen-landing.local
    ServerAlias www.clorismen-landing.local
    DocumentRoot "C:/xampp/htdocs/clorismen-landing/dist"

    <Directory "C:/xampp/htdocs/clorismen-landing/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # server/ (config.local.php berisi secret) ada di LUAR DocumentRoot, jadi tidak bisa diakses dari web.
    ErrorLog "logs/clorismen-landing-error.log"
    CustomLog "logs/clorismen-landing-access.log" common
</VirtualHost>
